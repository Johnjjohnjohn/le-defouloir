<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>Le Défouloir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout : écran unique façon case de BD — HUD en haut, scène dessinée au centre, trois coups en bas ; les menus (humeur, victimes, atelier) recouvrent tout l'écran */
:root{
  --bg:#14213d; --panel:#1f2f55; --ink:#1b1410; --ink-soft:#5e5249;
  --yellow:#ffd23f; --red:#ef3e36; --paper:#fffaf0; --muted:#b9c3dd;
  --skin:#f1c6a0; --barbg:#3b1a1a; --veil:rgba(20,33,61,.84);
  --display:"Bangers", Impact, "Arial Black", sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;box-sizing:border-box;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.hud{display:flex;align-items:center;gap:10px}
.who{min-width:0;flex:0 1 42%}
#name{font-family:var(--display);font-size:23px;line-height:1;letter-spacing:.04em;color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#desc{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gauge span{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:16px;border:3px solid var(--ink);background:var(--barbg);border-radius:4px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
#hp{height:100%;width:100%;background:var(--yellow);transition:width .18s ease-out}
.bar.low #hp{background:var(--red)}
.mini{flex:0 0 auto;font:800 12px var(--body);padding:7px 9px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
#mute[aria-pressed="true"]{text-decoration:line-through}
.stage{flex:1;min-height:0;position:relative;border:4px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);background:var(--panel)}
canvas{display:block}
#cv{width:100%;height:100%;touch-action:none;cursor:pointer}
.moves{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:620px){.moves{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.move{padding:4px 2px 4px}.move svg{width:28px;height:28px}}
.move{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 6px;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);font-family:var(--display);font-size:clamp(14px,3.9vw,18px);letter-spacing:0;cursor:pointer;overflow:hidden;min-width:0;padding-inline:2px}
.move > span:not(.cd),.move small{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.move svg{width:36px;height:36px}
.move small{font-family:var(--body);font-size:9px;font-weight:800;color:var(--ink-soft)}
.move[aria-pressed="true"]{background:var(--yellow)}
.move .cd{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--red)}
.move.locked{filter:grayscale(1);opacity:.5}
.move.locked::after{content:"🔒";position:absolute;top:2px;right:4px;font-size:14px;filter:none}
.move.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.move.ready{background:var(--red);color:var(--paper);animation:ready .5s ease-in-out infinite alternate}
.move.ready small{color:var(--paper)}
@keyframes ready{from{transform:scale(1)}to{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.move.ready,.move.nope{animation:none}}
.ic-skin{fill:var(--skin)}.ic-ink{fill:var(--ink)}.ic-red{fill:var(--red)}.ic-paper{fill:var(--paper)}
.move svg *{stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}

/* écrans */
.screen{position:absolute;inset:0;z-index:5;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;padding-block:18px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.screen.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);color:var(--yellow);margin:0;letter-spacing:.04em;line-height:.95;text-wrap:balance;text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink)}
h1{font-size:clamp(52px,15vw,88px)}
h2{font-size:clamp(34px,9vw,52px)}
h3{font-size:26px}
.screen p{margin:0;max-width:36ch;font-size:15px;line-height:1.45;text-wrap:balance}
.hint{font-size:13px!important;color:var(--muted)}
.big{font-family:var(--display);font-size:26px;letter-spacing:.06em;padding:10px 30px;background:var(--red);color:var(--paper);border:4px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn{font-family:var(--display);font-size:18px;letter-spacing:.05em;padding:8px 12px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn.hit{background:var(--red);color:var(--paper)}
.btn.ghost{background:var(--paper)}
.link{background:none;border:0;color:var(--muted);font:800 14px var(--body);text-decoration:underline;cursor:pointer;padding:6px}
.big:active,.move:active,.btn:active,.mini:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* humeur */
.moods{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px}
.mood{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;padding:12px 14px;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.mood b{font-family:var(--display);font-size:22px;letter-spacing:.04em;font-weight:400}
.mood small{grid-column:1;font-size:12px;font-weight:800;color:var(--ink-soft)}
.level{grid-row:1 / span 2;grid-column:2;display:flex;gap:3px;align-items:flex-end}
.level i{display:block;width:8px;border:2px solid var(--ink);border-radius:2px;background:var(--paper)}
.level i:nth-child(1){height:10px}.level i:nth-child(2){height:16px}.level i:nth-child(3){height:22px}.level i:nth-child(4){height:28px}
.level i.on{background:var(--red)}
.mood .smile{grid-row:1 / span 2;grid-column:2;font-family:var(--display);font-size:22px}

/* victimes */
.rhead{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card canvas{width:100%;aspect-ratio:4/5;max-width:100%;border-bottom:4px solid var(--ink)}
.card .info{padding:8px 10px 0;min-width:0}
.card .nm{font-family:var(--display);font-size:19px;letter-spacing:.03em;line-height:1.05;overflow-wrap:anywhere}
.card .stars{font-size:15px;line-height:1.1;color:#e0a100;letter-spacing:1px}
.card .ds{font-size:11px;font-weight:800;color:var(--ink-soft);overflow-wrap:anywhere}
.card .acts{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 8px 8px}
.card .btn{font-size:16px;padding:6px 4px}
.rfoot{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:8px}

/* atelier */
.ed-top{position:sticky;top:-18px;z-index:2;background:var(--bg);display:flex;align-items:center;gap:14px;padding-block:10px;border-bottom:3px solid var(--ink)}
#pv{width:120px;flex:0 0 120px;aspect-ratio:4/5;border:4px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink)}
.ed-top > div{min-width:0}
.fields{display:grid;gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fields input{font:700 16px var(--body);padding:10px 12px;border:3px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink);text-transform:none;letter-spacing:0;min-width:0}
.group{display:flex;flex-direction:column;gap:8px}
.group .lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:800 13px var(--body);padding:7px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.chip.locked{opacity:.4;text-decoration:line-through}
.chip.nope{animation:nope .3s}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--yellow);outline-offset:2px}
.ed-foot{position:sticky;bottom:-18px;background:var(--bg);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-block:12px 18px;border-top:3px solid var(--ink)}
.ed-foot .btn{font-size:15px;padding:8px 2px}

.ask{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.ask b{font-family:var(--display);font-size:26px;letter-spacing:.04em;font-weight:400}

/* fin */
.adbox{width:100%;max-width:468px;margin:6px auto 0;text-align:center}
.adbox small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.adbox ins{display:block;min-height:60px}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);padding:8px 14px;min-width:84px}
.stat b{display:block;font-family:var(--display);font-size:30px;letter-spacing:.03em;font-variant-numeric:tabular-nums;font-weight:400}
.stat small{font-size:11px;font-weight:800;color:var(--ink-soft)}
.after{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.langpick{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted)}
.langpick select{font:800 14px var(--body);padding:6px 10px;border:3px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
</style>
</head>
<body>

<div id="app">
  <header class="hud">
    <div class="who"><div id="name">Le Défouloir</div><small id="desc"></small></div>
    <div class="gauge"><span data-i18n="resist">Résistance</span><div class="bar" id="bar"><div id="hp"></div></div></div>
    <button class="mini" id="menu" data-i18n="menu">Menu</button>
    <button class="mini" id="mute" aria-pressed="false" data-i18n="sound">Son</button>
  </header>

  <div class="stage"><canvas id="cv" data-i18n-aria="stage"></canvas>
    <div class="ask" id="ask" hidden role="dialog" data-i18n-aria="ask">
      <b data-i18n="ask">Alors, ça va mieux ?</b>
      <div class="after"><button class="btn hit" id="askYes" data-i18n="askYes">Oui, ça va mieux</button><button class="btn ghost" id="askNo" data-i18n="askNo">Je continue</button></div>
    </div>
  </div>

  <nav class="moves" data-i18n-aria="moves">
    <button class="move" data-w="slap" aria-pressed="true">
      <svg viewBox="0 0 40 40"><path class="ic-skin" d="M12 37C8 31 7.5 25 8.5 19V10a2.6 2.6 0 0 1 5.2 0v8V6.5a2.6 2.6 0 0 1 5.2 0V18V7.5a2.6 2.6 0 0 1 5.2 0V19v-8a2.6 2.6 0 0 1 5.2 0v13c0 7-3 11-7.5 13z"/></svg>
      <span data-i18n="slap">Gifle</span><small data-i18n="slapSub">rapide</small><span class="cd"></span>
    </button>
    <button class="move" data-w="punch" aria-pressed="false">
      <svg viewBox="0 0 40 40"><rect class="ic-paper" x="12" y="26" width="16" height="11" rx="2"/><circle class="ic-red" cx="21" cy="15" r="12"/><ellipse class="ic-red" cx="10" cy="19" rx="4.5" ry="6.5"/></svg>
      <span data-i18n="punch">Poing</span><small data-i18n="punchSub">costaud</small><span class="cd"></span>
    </button>
    <button class="move" data-w="head" aria-pressed="false">
      <svg viewBox="0 0 40 40"><circle class="ic-skin" cx="20" cy="24" r="12"/><path class="ic-ink" d="M8 22a12 12 0 0 1 24 0c-6-4-18-4-24 0z"/><path d="M12 6l2 4M20 3v5M28 6l-2 4" fill="none"/></svg>
      <span data-i18n="head">Boule</span><small data-i18n="headSub">dévastateur</small><span class="cd" id="cd-head"></span>
    </button>
    <button class="move" data-w="kick" aria-pressed="false">
      <svg viewBox="0 0 40 40"><path class="ic-paper" d="M3 5l15 9-5 9L2 15z"/><path class="ic-skin" d="M15 14c6 1 12 3 19 6 4 2 4 7 0 7-7 1-15-1-21-4z"/><path d="M6 30c6 4 14 6 22 6M10 35c4 2 8 3 12 3" fill="none"/></svg>
      <span data-i18n="kick">Karaté</span><small data-i18n="kickSub">coup de pied</small><span class="cd" id="cd-kick"></span>
    </button>
    <button class="move" data-w="pan" aria-pressed="false">
      <svg viewBox="0 0 40 40"><path class="ic-red" d="M23 21l13 13a2.6 2.6 0 0 1-3.7 3.7L19.3 24.7z"/><circle class="ic-ink" cx="15" cy="15" r="12.5"/><path d="M8.5 12a8 8 0 0 1 6-5.5" fill="none" style="stroke:#fffaf0"/></svg>
      <span data-i18n="pan">Poêle</span><small data-i18n="panSub">sonore</small><span class="cd" id="cd-pan"></span>
    </button>
    <button class="move" data-w="pie" aria-pressed="false">
      <svg viewBox="0 0 40 40"><path class="ic-paper" d="M5 23c0-7 7-11 15-11s15 4 15 11z"/><circle class="ic-red" cx="20" cy="10" r="3.6"/><path class="ic-skin" d="M3 23h34l-3.5 9h-27z"/></svg>
      <span data-i18n="pie">Tarte</span><small data-i18n="pieSub">à la crème</small><span class="cd" id="cd-pie"></span>
    </button>
  </nav>

  <section class="screen center" id="scr-title">
    <h1 data-i18n="brand">Le Défouloir</h1>
    <p data-i18n="tagline"></p>
    <p class="hint" data-i18n="howto"></p>
    <button class="big" id="start" data-i18n="start">Commencer</button>
    <label class="langpick"><span data-i18n="lang">Langue</span><select class="lang-select"></select></label>
  </section>

  <section class="screen center" id="scr-mood" hidden>
    <h2 data-i18n="moodT"></h2>
    <p class="hint" data-i18n="moodHint"></p>
    <div class="moods" id="moods"></div>
  </section>

  <section class="screen" id="scr-roster" hidden>
    <div class="wrap">
      <div class="rhead"><h2 data-i18n="rosterT"></h2><p class="hint" id="moodLine"></p></div>
      <div class="grid" id="grid"></div>
      <div class="rfoot">
        <button class="big" id="all" data-i18n="all"></button>
        <button class="link" id="chgMood" data-i18n="chgMood"></button>
        <label class="langpick"><span data-i18n="lang">Langue</span><select class="lang-select"></select></label>
        <div class="adbox" data-ad="roster" hidden><small data-i18n="ad">Publicité</small><ins class="adsbygoogle" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
      </div>
    </div>
  </section>

  <section class="screen" id="scr-edit" hidden>
    <div class="wrap">
      <div class="ed-top"><canvas id="pv"></canvas><div><h2 id="edTitle" data-i18n="edTitle"></h2><p class="hint" data-i18n="edHint"></p></div></div>
      <div class="fields">
        <label for="fName"><span data-i18n="fName"></span><input id="fName" maxlength="28" autocomplete="off"></label>
        <label for="fDesc"><span data-i18n="fDesc"></span><input id="fDesc" maxlength="40" autocomplete="off" data-i18n-ph="fDescPh"></label>
        <label for="fPhrase"><span data-i18n="fPhrase"></span><input id="fPhrase" maxlength="90" autocomplete="off"></label>
      </div>
      <div id="groups" class="wrap" style="gap:18px"></div>
      <div class="ed-foot">
        <button class="btn ghost" id="edReset" data-i18n="edReset"></button>
        <button class="btn" id="edRand" data-i18n="edRand"></button>
        <button class="btn ghost" id="edCancel" data-i18n="edCancel"></button>
        <button class="btn hit" id="edSave" data-i18n="edSave"></button>
      </div>
    </div>
  </section>

  <section class="screen center" id="scr-end" hidden>
    <h2 id="endTitle">K.O. !</h2>
    <div class="stats">
      <div class="stat"><b id="sHits">0</b><small data-i18n="hits"></small></div>
      <div class="stat"><b id="sCombo">0</b><small data-i18n="combo"></small></div>
      <div class="stat"><b id="sTime">0 s</b><small data-i18n="time"></small></div>
    </div>
    <h3 data-i18n="nowQ"></h3>
    <div class="after" id="feel">
      <button class="btn hit" id="better" data-i18n="better"></button>
      <button class="btn" id="still" data-i18n="still"></button>
    </div>
    <p id="afterMsg" hidden></p>
    <div class="after">
      <button class="btn ghost" id="again" data-i18n="again"></button>
      <button class="btn ghost" id="toRoster" data-i18n="toRoster"></button>
    </div>
    <div class="adbox" data-ad="end" hidden><small data-i18n="ad">Publicité</small><ins class="adsbygoogle" data-ad-format="auto" data-full-width-responsive="true"></ins></div>
  </section>
</div>

<script>
/* ---------- PUBLICITÉ (Google AdSense) ----------
   Colle ici ton identifiant éditeur AdSense (ex. "ca-pub-1234567890123456")
   et, si tu en crées, les numéros de tes blocs d'annonces.
   Tant que ADSENSE_CLIENT est vide, aucune pub ne s'affiche.
   Les pubs n'apparaissent jamais pendant le combat : seulement sur l'écran
   de choix des victimes et sur l'écran de fin (K.O.). */
const ADSENSE_CLIENT = "";
const AD_SLOTS = { roster: "", end: "" };
</script>
<script>
(() => {
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const VW = 400, VH = 520, TAU = Math.PI * 2, INK = '#1b1410';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

/* ---------- utilitaires ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function fs(c, fill) { c.fillStyle = fill; c.fill(); c.stroke(); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = v => Math.round(v * (1 - k)); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- options d'apparence ---------- */

  chars: [
    { name: "不機嫌な部長", desc: "架空の上司", phrase: "また遅刻か？査定で話し合おうじゃないか。", taunts: ["もう帰るの？まだ夜7時だよ。", "報告書？やり直し。11ポイントでね。", "土曜は全員出社。笑顔で。", "有給？過大評価だね。"] },
    { name: "書類おばさん", desc: "架空の窓口係", phrase: "書類B-12が足りません。火曜日にまた来てください。11時までに。", taunts: ["窓口はあと2分で閉まります。", "整理券を取って。それじゃない。", "両面コピーって言いましたよね。", "私の担当じゃありません。"] },
    { name: "ドリル隣人", desc: "上の階の架空の住人", phrase: "新しいドリル買ったんだ。聞く？日曜の朝8時に。", taunts: ["カラオケは深夜2時が基本。", "君の駐車場？空いてるように見えたから。", "また家具を動かしてるだけだよ。", "犬が吠えてる？歌ってるんだよ。"] },
    { name: "知ったかぶり同僚", desc: "架空の同僚", phrase: "そのやり方？私なら違うやり方にするけどね。もっといいやつ。", taunts: ["正確に言うと、それ間違ってるよ。", "部長をCCに入れといたから。", "あなたのためを思って言ってるの。", "え、知らなかったの？"] },
    { name: "コメント荒らし", desc: "100%架空のネット荒らし", phrase: "どこにでもコメントするよ。ここにもね。1get！", taunts: ["ソース？記事は読んでない。", "君の意見は間違い。根拠はない。", "論破。", "昔はよかった。いつ？昔。"] },
    { name: "クーポン系インフルエンサー", desc: "架空のインフルエンサー", phrase: "やっほー！このビンタは提供付きです。コードはBINTA10！", taunts: ["いいねとチャンネル登録よろしく！", "待って、リアクション撮ってるから。", "通知ベルもオンにしてね。", "このK.O.、絶対バズる。"] },
    { name: "熱血コーチ", desc: "架空のコーチ", phrase: "ほら、腕立てあと50回！それがビンタか？", taunts: ["もっと強く！昼寝の時間じゃないぞ！", "これ準備運動？", "痛みなくして成長なし！", "朝飯前だよ、こんなの。"] },
    { name: "イケメン気取り", desc: "架空のモテ男", phrase: "顔だけはやめて！商売道具なんだ。", taunts: ["正直、俺のことカッコいいと思ってるでしょ。", "髪型に気をつけて！", "君の瞳に僕が映ってる。", "K.O.されても俺はイケてる。"] },
    { name: "レトロなピンナップ", desc: "架空の50年代スター", phrase: "口紅に気をつけて、ダーリン。高かったのよ！", taunts: ["カールが崩れちゃったじゃない！", "私はスターよ、サンドバッグじゃないわ。", "ハリウッドが待ってるの、早くして。", "K.O.でも私は華やかよ。"] },
    { name: "グループチャットの女王", desc: "架空のメッセージ連投魔", phrase: "147件のメッセージ見た？見てない？じゃあ8分のボイスメッセージ送るね。", taunts: ["23時58分に既読。なんで返信しないの？", "12分のボイメ、最後まで聞いてね。", "新しいグループ作った。また。", "みんなおやすみ！スタンプ40個つき。"] },
    { name: "キレゲーマー", desc: "架空のオンラインゲーマー", phrase: "ラグのせいだ！じゃなきゃもう勝ってた。", taunts: ["GG EZ。", "芋ってるとかダサすぎ。", "ちょっと待って、ピザ来た。", "リベンジ！いや、3回勝負！"] },
    { name: "シナジー課長", desc: "架空のプロジェクトマネージャー", phrase: "君の昼休みをディスラプトしよう。5分後に会議ね。", taunts: ["会議について話す会議、入れとく？", "もっと主体的に！", "問題じゃない、チャンスだよ。", "全部CCに入れとくから。"] },
    { name: "おせっかいおばさん", desc: "なんでも知ってる架空の親戚", phrase: "まだ独身なの？その仕事、ちゃんと稼げてる？", taunts: ["太った？それとも痩せた？", "いとこはお医者さんなのよ。", "ちゃんと食べなさい、顔色悪いわよ！", "昔はおばさんを叩く子なんていなかったわ！"] }

  chars: [
    { name: "꼰대 부장님", desc: "가상의 상사", phrase: "또 지각이야? 연말 평가 때 얘기하자고.", taunts: ["벌써 퇴근해? 아직 저녁 7시인데.", "보고서? 다시 해. 11포인트로.", "토요일 전원 출근. 웃는 얼굴로.", "휴가? 그거 과대평가야."] },
    { name: "서류 아주머니", desc: "가상의 창구 직원", phrase: "B-12 서류가 없네요. 화요일에 다시 오세요. 11시 전에.", taunts: ["창구 2분 뒤에 마감이에요.", "번호표 뽑으세요. 그거 말고요.", "양면 복사라고 했잖아요.", "제 담당이 아니에요."] },

    { name: "척척박사 동료", desc: "가상의 직장 동료", phrase: "그걸 그렇게 했어? 나라면 다르게 했을 텐데. 더 잘.", taunts: ["정확히 말하면 너 틀렸어.", "부장님 참조로 넣었어.", "다 너 잘되라고 하는 말이야.", "어머, 몰랐어?"] },

    { name: "할인코드 인플루언서", desc: "가상의 인플루언서", phrase: "안녕 여러분! 이 따귀는 협찬이에요. 코드 DDAGWI10!", taunts: ["좋아요와 구독 부탁해요!", "잠깐, 리액션 찍는 중이야.", "알림 설정 꼭 눌러요.", "이 K.O. 무조건 떡상각."] },
    { name: "헬스 코치", desc: "가상의 트레이너", phrase: "자, 팔굽혀펴기 50개 더! 그게 따귀야?", taunts: ["더 세게! 낮잠 시간 아니야!", "이거 몸풀기야?", "고통 없이는 성장도 없다!", "이 정도는 아침 먹기 전이야."] },
    { name: "느끼한 미남", desc: "가상의 바람둥이", phrase: "얼굴만은 안 돼! 내 밥줄이라고.", taunts: ["솔직히 나 잘생겼다고 생각하지?", "머리 조심해!", "네 눈에 내가 비쳐.", "K.O.돼도 난 여전히 멋져."] },
    { name: "레트로 핀업걸", desc: "가상의 50년대 스타", phrase: "립스틱 조심해, 자기야. 엄청 비싼 거야!", taunts: ["내 컬이 다 망가졌잖아!", "난 스타지, 샌드백이 아니야.", "할리우드가 기다려, 서둘러.", "K.O.돼도 난 여전히 우아해."] },
    { name: "단톡방 여왕", desc: "가상의 메시지 폭탄녀", phrase: "내 메시지 147개 봤어? 아니? 그럼 8분짜리 음성 메시지 보낼게.", taunts: ["23시 58분에 읽음. 왜 답 안 해?", "12분짜리 음성이야, 끝까지 들어.", "단톡방 또 새로 팠어.", "다들 굿나잇! 이모티콘 40개랑 같이."] },
    { name: "분노 게이머", desc: "가상의 온라인 게이머", phrase: "렉 때문이야! 아니면 벌써 이겼지.", taunts: ["GG EZ.", "존버 캠핑이라니, 비겁해.", "잠깐, 피자 왔어.", "한 판 더! 아니, 세 판 더!"] },
    { name: "시너지 팀장", desc: "가상의 프로젝트 매니저", phrase: "네 점심시간을 혁신해 보자고. 5분 뒤 회의.", taunts: ["회의에 대해 얘기할 회의 잡을까?", "주도적으로 해!", "문제가 아니라 기회야.", "전부 참조로 넣을게."] },

  chars: [
    { name: "Ворчливый Шеф", desc: "Твой вымышленный начальник", phrase: "Опять опоздал? Обсудим на годовой оценке.", taunts: ["Уже уходишь? Только семь вечера.", "Отчёт? Переделать. Шрифтом 11.", "В субботу все на работу. С улыбкой.", "Отпуск? Переоценён."] },
    { name: "Тётя Бланк", desc: "Вымышленная служащая", phrase: "У вас нет формы Б-12. Приходите во вторник. До одиннадцати.", taunts: ["Окошко закрывается через две минуты.", "Возьмите талончик. Не этот.", "Я сказала: двусторонняя копия.", "Это не ко мне."] },
    { name: "Сосед с Дрелью", desc: "Твой сосед сверху, вымышленный", phrase: "Купил новую дрель. Хочешь послушать? В воскресенье, в восемь утра?", taunts: ["Караоке — только в два ночи.", "Твоё парковочное место? Оно казалось свободным.", "Просто двигаю мебель. Опять.", "Собака лает? Она поёт."] },
    { name: "Коллега-Всезнайка", desc: "Твоя вымышленная коллега", phrase: "Ты так сделал? Я бы сделала иначе. Лучше, в общем.", taunts: ["Вообще-то, формально, ты не прав.", "Я поставила шефа в копию.", "Я же просто помочь хочу.", "Ой, а ты не знал?"] },
    { name: "Тролль из Комментариев", desc: "Интернет-тролль, на 100% вымышленный", phrase: "Комментирую всё подряд. Даже здесь. Первый!", taunts: ["Источник? Нет, статью я не читал.", "Твоё мнение неверно. Аргументов нет.", "Ратио.", "Раньше было лучше. Когда? Раньше."] },
    { name: "Блогерша с Промокодом", desc: "Вымышленная блогерша", phrase: "Всем привет! Эта пощёчина — реклама. Промокод SHLEP10!", taunts: ["Ставьте лайк и подписывайтесь!", "Стоп, снимаю твою реакцию.", "Нажмите колокольчик, это важно.", "Этот нокаут залетит в тренды."] },
    { name: "Фитнес-тренер", desc: "Твой вымышленный тренер", phrase: "Давай, ещё 50 отжиманий! Это ты называешь пощёчиной?", taunts: ["Сильнее! Тут не тихий час!", "Это разминка?", "Без боли нет результата!", "Я это делаю до завтрака."] },
    { name: "Красавчик-Сердцеед", desc: "Вымышленный ловелас", phrase: "Только не по лицу! Это мой хлеб.", taunts: ["Признайся, ты считаешь меня красавчиком.", "Осторожно, причёска!", "Я вижу себя в твоих глазах.", "Даже в нокауте я хорош."] },
    { name: "Ретро Пин-ап", desc: "Вымышленная звезда 50-х", phrase: "Осторожно с помадой, дорогой, она стоила целое состояние!", taunts: ["Ты испортил мне локоны!", "Я звезда, а не груша для битья.", "Голливуд ждёт, поторопись.", "Даже в нокауте я гламурна."] },
    { name: "Королева Чата", desc: "Вымышленная спамерша сообщений", phrase: "Ты видел мои 147 сообщений? Нет? Держи голосовое на 8 минут.", taunts: ["Прочитано в 23:58. Почему не отвечаешь?", "Коротенькое голосовое, 12 минут, дослушай.", "Я создала новый чат. Опять.", "Всем спокойной ночи! И 40 гифок."] },
    { name: "Злой Геймер", desc: "Вымышленный онлайн-игрок", phrase: "Это лаги! Иначе я бы тебя уже победил.", taunts: ["GG EZ.", "Ты кемпишь, позорище.", "Пауза, пицца приехала.", "Реванш! Нет, тройной реванш!"] },
    { name: "Менеджер Синергии", desc: "Вымышленный руководитель проекта", phrase: "Давай прокачаем твой обеденный перерыв. Созвон через 5 минут.", taunts: ["Назначим встречу, чтобы обсудить встречу?", "Проявляй инициативу!", "Это не проблема, это возможность.", "Буду ставить тебя в копию всего."] },
    { name: "Тётя-Советчица", desc: "Вымышленная тётя, которая всё знает", phrase: "Всё ещё один? А эта работа вообще деньги приносит?", taunts: ["Ты поправился? Или похудел?", "Твой двоюродный брат, между прочим, врач.", "Поешь, ты такой бледный!", "В наше время тётю никто не бил!"] }
  ]

  chars: [
    { name: "Буркотливий Шеф", desc: "Твій вигаданий начальник", phrase: "Знову спізнився? Обговоримо на річному оцінюванні.", taunts: ["Уже йдеш? Тільки сьома вечора.", "Звіт? Переробити. Шрифтом 11.", "У суботу всі на роботу. З усмішкою.", "Відпустка? Переоцінена."] },
    { name: "Пані Бланк", desc: "Вигадана службовиця", phrase: "У вас немає форми Б-12. Приходьте у вівторок. До одинадцятої.", taunts: ["Віконце зачиняється за дві хвилини.", "Візьміть талончик. Не цей.", "Я ж казала: двостороння копія.", "Це не до мене."] },
    { name: "Сусід з Дрилем", desc: "Твій сусід згори, вигаданий", phrase: "Купив новий дриль. Хочеш послухати? У неділю, о восьмій ранку?", taunts: ["Караоке — тільки о другій ночі.", "Твоє паркомісце? Воно здавалося вільним.", "Просто пересуваю меблі. Знову.", "Собака гавкає? Вона співає."] },
    { name: "Колега-Всезнайка", desc: "Твоя вигадана колега", phrase: "Ти так зробив? Я б зробила інакше. Краще, загалом.", taunts: ["Взагалі-то, формально, ти помиляєшся.", "Я поставила шефа в копію.", "Я ж просто допомогти хочу.", "Ой, а ти не знав?"] },
    { name: "Троль з Коментарів", desc: "Інтернет-троль, на 100% вигаданий", phrase: "Коментую все підряд. Навіть тут. Перший!", taunts: ["Джерело? Ні, статтю я не читав.", "Твоя думка хибна. Аргументів немає.", "Раціо.", "Раніше було краще. Коли? Раніше."] },
    { name: "Блогерка з Промокодом", desc: "Вигадана блогерка", phrase: "Всім привіт! Цей ляпас — реклама. Промокод LYAS10!", taunts: ["Ставте лайк і підписуйтеся!", "Стоп, знімаю твою реакцію.", "Натисніть дзвіночок, це важливо.", "Цей нокаут залетить у тренди."] },
    { name: "Фітнес-тренер", desc: "Твій вигаданий тренер", phrase: "Давай, ще 50 віджимань! Це ти називаєш ляпасом?", taunts: ["Сильніше! Тут не тиха година!", "Це розминка?", "Без болю немає результату!", "Я це роблю до сніданку."] },
    { name: "Красунчик-Серцеїд", desc: "Вигаданий ловелас", phrase: "Тільки не по обличчю! Це мій хліб.", taunts: ["Зізнайся, ти вважаєш мене красунчиком.", "Обережно, зачіска!", "Я бачу себе у твоїх очах.", "Навіть у нокауті я гарний."] },
    { name: "Ретро Пін-ап", desc: "Вигадана зірка 50-х", phrase: "Обережно з помадою, любий, вона коштувала цілий статок!", taunts: ["Ти зіпсував мені локони!", "Я зірка, а не боксерська груша.", "Голлівуд чекає, поквапся.", "Навіть у нокауті я гламурна."] },
